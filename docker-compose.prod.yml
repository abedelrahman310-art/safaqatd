version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=safaqat_db
      - POSTGRES_USER=safaqat_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-safaqat_secure_pass_2026}
    ports:
      - "5432:5432"
    restart: always

  web:
    build: 
      context: .
      dockerfile: Dockerfile
    image: safaqat_web:latest
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DATABASE_URL=postgres://safaqat_user:${DB_PASSWORD:-safaqat_secure_pass_2026}@db:5432/safaqat_db
      - SECRET_KEY=${SECRET_KEY:-django-insecure-prod-key-must-be-set-via-env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8000}
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
