# fly.toml app configuration file for Safaqat Smart
# See https://fly.io/docs/reference/configuration/

app = "safaqat-smart-2026"
primary_region = "fra" # Frankfurt (أقرب منطقة سريعة للجزائر)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DJANGO_ENV = "production"
  ALLOWED_HOSTS = ".fly.dev,safaqat-smart-2026.fly.dev,localhost,127.0.0.1"
  CSRF_TRUSTED_ORIGINS = "https://*.fly.dev,https://safaqat-smart-2026.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "safaqat_data"
  destination = "/app/media"
