version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=safaqat_db
      - POSTGRES_USER=safaqat_user
      - POSTGRES_PASSWORD=safaqat_pass
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://safaqat_user:safaqat_pass@db:5432/safaqat_db
    depends_on:
      - db

volumes:
  postgres_data:
