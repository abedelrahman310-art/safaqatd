{% extends 'core/base.html' %}

{% block title %}تم إرسال الرابط{% endblock %}

{% block content %}
<div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; overflow: hidden;"></div>

<section style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 5%; position: relative; z-index: 1;">
    <div style="background: rgba(15, 20, 30, 0.7); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); padding: 3rem 2.5rem; border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.5); max-width: 450px; width: 100%; color: white; text-align: center;">
        
        <div style="width: 80px; height: 80px; background: rgba(16, 185, 129, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto; border: 2px solid var(--success);">
            <i class="fas fa-check fa-3x" style="color: var(--success);"></i>
        </div>
        
        <h2 style="margin: 0 0 1rem 0; font-size: 1.8rem;">تحقق من بريدك الإلكتروني</h2>
        <p style="color: rgba(255,255,255,0.7); line-height: 1.6; margin-bottom: 2rem;">لقد أرسلنا لك رابطاً لتعيين كلمة مرور جديدة. يرجى التحقق من صندوق الوارد الخاص بك أو مجلد الرسائل المزعجة (Spam).</p>
        
        <a href="{% url 'accounts:login' %}" class="btn btn-secondary" style="width: 100%; justify-content: center;">العودة لصفحة الدخول</a>
    </div>
</section>
{% endblock %}
