{% extends 'core/base.html' %}

{% block title %}استرجاع كلمة المرور{% endblock %}

{% block content %}
<div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; background: linear-gradient(to top, #0f172a, #1e293b, #d4af37, #ef4444, #1e293b, #0f172a); background-size: 100% 400%; animation: gradientWave 15s ease infinite; overflow: hidden;">
    <div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 50px 50px; opacity: 0.4;"></div>
</div>

<section style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 5%; position: relative; z-index: 1;">
    <div style="background: rgba(15, 20, 30, 0.7); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); padding: 3rem 2.5rem; border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.5); max-width: 450px; width: 100%; color: white;">
        
        <a href="{% url 'accounts:login' %}" style="position: absolute; top: 1.5rem; right: 1.5rem; color: rgba(255,255,255,0.6); text-decoration: none; font-size: 1.2rem;">
            <i class="fas fa-arrow-right"></i>
        </a>

        <div style="text-align: center; margin-bottom: 2rem;">
            <i class="fas fa-unlock-alt fa-3x" style="color: #d4af37; margin-bottom: 1rem;"></i>
            <h2 style="margin: 0; font-size: 1.8rem; font-weight: 800;">استرجاع كلمة المرور</h2>
            <p style="color: rgba(255,255,255,0.7); margin-top: 0.5rem; font-size: 0.95rem;">أدخل بريدك الإلكتروني وسنرسل لك رابطاً لتعيين كلمة مرور جديدة.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group premium-input-group">
                <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <input type="email" name="email" required placeholder="أدخل البريد الإلكتروني المسجل به...">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; font-size: 1.1rem; padding: 1rem; margin-top: 1.5rem;">
                إرسال الرابط <i class="fas fa-paper-plane" style="margin-right: 8px;"></i>
            </button>
        </form>
    </div>
</section>
{% endblock %}
