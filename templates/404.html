{% extends 'core/base.html' %}

{% block title %}الصفحة غير موجودة | صفقات ذكية{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card" style="box-shadow: 0 0 50px rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.3);">
        <i class="fas fa-exclamation-triangle fa-5x" style="color: var(--danger); margin-bottom: 2rem;"></i>
        <h1 style="font-size: 5rem; margin: 0; background: linear-gradient(135deg, var(--danger), #f87171); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">404</h1>
        <h2 style="margin-bottom: 1rem;">عذراً، الصفحة غير موجودة</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">يبدو أن الرابط الذي تحاول الوصول إليه غير صحيح، أو تم نقل الصفحة إلى مكان آخر.</p>
        <a href="{% url 'core:index' %}" class="btn btn-primary"><i class="fas fa-home"></i> العودة للرئيسية</a>
    </div>
</section>
{% endblock %}
