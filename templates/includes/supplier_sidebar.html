<aside class="supplier-sidebar" :class="{ 'collapsed': !sidebarOpen }" x-data="{ sidebarOpen: window.innerWidth > 768 }" @resize.window="sidebarOpen = window.innerWidth > 768" @keydown.escape.window="if(window.innerWidth <= 768) sidebarOpen = false">
    
    <!-- Mobile Close Overlay -->
    <div class="sidebar-overlay" x-show="sidebarOpen && window.innerWidth <= 768" @click="sidebarOpen = false" x-transition.opacity></div>

    <div class="sidebar-container" x-show="sidebarOpen || window.innerWidth > 768" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full">
        
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <i class="fas fa-handshake accent-icon"></i>
                <span class="brand-text" x-show="sidebarOpen">فضاء المتعامل</span>
            </div>
            <!-- Mobile close button -->
            <button class="btn-close-sidebar" @click="sidebarOpen = false" aria-label="إغلاق القائمة">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <nav class="sidebar-nav" aria-label="التنقل الرئيسي للمتعامل الاقتصادي">
            
            <div class="nav-group">
                <h4 class="nav-group-title" x-show="sidebarOpen">الرئيسية</h4>
                <a href="{% url 'suppliers:dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" aria-current="{% if request.resolver_match.url_name == 'dashboard' %}page{% endif %}">
                    <i class="fas fa-home nav-icon"></i>
                    <span class="nav-text" x-show="sidebarOpen">لوحة التحكم</span>
                </a>
            </div>

            <div class="nav-group">
                <h4 class="nav-group-title" x-show="sidebarOpen">الفرص والصفقات</h4>
                <a href="{% url 'suppliers:tenders_list' %}" class="nav-item {% if request.resolver_match.url_name == 'tenders_list' or request.resolver_match.url_name == 'tender_detail' %}active{% endif %}" aria-current="{% if request.resolver_match.url_name == 'tenders_list' or request.resolver_match.url_name == 'tender_detail' %}page{% endif %}">
                    <i class="fas fa-search nav-icon"></i>
                    <span class="nav-text" x-show="sidebarOpen">البحث عن الصفقات</span>
                </a>
                
                <!-- Placeholder for future links -->
                <div class="nav-item-disabled" title="ميزة قادمة">
                    <i class="fas fa-bookmark nav-icon text-muted"></i>
                    <span class="nav-text text-muted" x-show="sidebarOpen">الصفقات المحفوظة</span>
                    <span class="badge badge-soon" x-show="sidebarOpen">قريباً</span>
                </div>
            </div>

            <div class="nav-group">
                <h4 class="nav-group-title" x-show="sidebarOpen">مساعد الصفقات الذكي</h4>
                <a href="{% url 'ai_supplier:recommendations' %}" class="nav-item {% if request.resolver_match.app_name == 'ai_supplier' and request.resolver_match.url_name == 'recommendations' %}active{% endif %}">
                    <i class="fas fa-bullseye nav-icon text-sky-500"></i>
                    <span class="nav-text" x-show="sidebarOpen">الصفقات الموصى بها</span>
                </a>
                <a href="{% url 'ai_supplier:rfp_summary' %}" class="nav-item {% if request.resolver_match.app_name == 'ai_supplier' and request.resolver_match.url_name == 'rfp_summary' %}active{% endif %}">
                    <i class="fas fa-file-invoice nav-icon text-amber-500"></i>
                    <span class="nav-text" x-show="sidebarOpen">الملخص الذكي للدفاتر</span>
                </a>
                <a href="{% url 'ai_supplier:readiness_check' %}" class="nav-item {% if request.resolver_match.app_name == 'ai_supplier' and request.resolver_match.url_name == 'readiness_check' %}active{% endif %}">
                    <i class="fas fa-shield-check nav-icon text-emerald-500"></i>
                    <span class="nav-text" x-show="sidebarOpen">الفاحص المسبق لملف العرض</span>
                </a>
            </div>

            <div class="nav-group">
                <h4 class="nav-group-title" x-show="sidebarOpen">الحساب</h4>
                <a href="{% url 'accounts:profile' %}" class="nav-item {% if request.resolver_match.url_name == 'profile' %}active{% endif %}" aria-current="{% if request.resolver_match.url_name == 'profile' %}page{% endif %}">
                    <i class="fas fa-user-circle nav-icon"></i>
                    <span class="nav-text" x-show="sidebarOpen">الملف الشخصي</span>
                </a>
                <a href="{% url 'accounts:logout' %}" class="nav-item text-danger">
                    <i class="fas fa-sign-out-alt nav-icon"></i>
                    <span class="nav-text" x-show="sidebarOpen">تسجيل الخروج</span>
                </a>
            </div>
            
        </nav>
    </div>
</aside>
