databases:
  - name: safakat-db
    databaseName: safakat
    user: safakat_user
    plan: free

services:
  - type: web
    name: safakat-web
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: safakat-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings"
      - key: WEB_CONCURRENCY
        value: "3"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DEBUG
        value: "False"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://safakat-web.onrender.com"
      - key: USE_S3
        value: "False"
      - key: ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
