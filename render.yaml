databases:
  - name: safakat-db
    databaseName: safakat
    user: safakat_user
    plan: free
services:
  - type: redis
    name: safakat-redis
    plan: free

  - type: web
    name: safakat-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safakat-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: safakat-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: safakat-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: ALLOWED_HOSTS
        value: "safakat-web.onrender.com,.onrender.com"
      - key: DEBUG
        value: "False"
      - key: ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: worker
    name: safakat-worker
    env: python
    buildCommand: "./build.sh"
    startCommand: "celery -A config worker --loglevel=info"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safakat-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: safakat-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: safakat-redis
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
